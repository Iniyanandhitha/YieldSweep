[package]
name = "yield-sweep"
version = "0.1.0"
edition = "2021"
description = "A DeFi Vault that automatically sweeps idle user funds into yield-generating strategies on Stellar Soroban"
authors = ["Yield-Sweep Team"]
license = "MIT"
repository = "https://github.com/yield-sweep/yield-sweep-contracts"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "21.7.6" }

[dev-dependencies]
soroban-sdk = { version = "21.7.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
